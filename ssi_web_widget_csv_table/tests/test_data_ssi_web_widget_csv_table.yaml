scenarios:
  - name: "ssi_web_widget_csv_table - Module is installed"
    steps:
      - step: "Search for installed module"
        action: "search"
        model: "ir.module.module"
        domain:
          - ["name", "=", "ssi_web_widget_csv_table"]
          - ["state", "=", "installed"]
        save_as: "module"
        expect_count: 1
