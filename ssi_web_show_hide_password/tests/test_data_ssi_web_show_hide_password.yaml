scenarios:
  - name: "ssi_web_show_hide_password - Module is installed"
    steps:
      - step: "Search for installed module"
        action: "search"
        model: "ir.module.module"
        domain:
          - ["name", "=", "ssi_web_show_hide_password"]
          - ["state", "=", "installed"]
        save_as: "module"
        expect_count: 1

  - name: "ssi_web_show_hide_password - Assets template is registered"
    steps:
      - step: "Search for the web.assets_common inherited template"
        action: "search"
        model: "ir.ui.view"
        domain:
          - ["key", "=", "ssi_web_show_hide_password.assets_common"]
        save_as: "assets_template"
        expect_count: 1
